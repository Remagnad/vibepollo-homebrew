name: Build and publish Vibepollo Cask integration

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "cask-payload/**"
      - "integration/**"
      - "scripts/package-cask-payload.sh"
      - "scripts/test-drm-packages.py"
      - "scripts/migrate-installed-cask-sudo.py"
      - ".github/workflows/build-cask-integration.yml"
      - "upstream-version"
      - "upstream-commit"

permissions:
  contents: write

concurrency:
  group: vibepollo-cask-integration
  cancel-in-progress: false

env:
  HOMEBREW_NO_AUTO_UPDATE: "1"
  HOMEBREW_NO_ANALYTICS: "1"

jobs:
  package-and-publish:
    name: Package and publish privileged Cask integration only
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out tap
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Read the currently published upstream version
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          version="$(tr -d '[:space:]' < upstream-version)"
          upstream_commit="$(tr -d '[:space:]' < upstream-commit)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$upstream_commit" =~ ^[0-9a-f]{40}$ ]]
          release_json="$(gh api "repos/Remagnad/vibepollo-homebrew/releases/tags/vibepollo-$version")"
          published_at="$(jq -r '.published_at' <<<"$release_json")"
          [[ "$published_at" != "null" && -n "$published_at" ]]
          source_asset="vibepollo-source-$version.tar.gz"
          if ! jq -e --arg name "$source_asset" '.assets[] | select(.name == $name)' <<<"$release_json" >/dev/null; then
            echo "::error::The published app release has no verified source archive $source_asset"
            exit 1
          fi
          {
            echo "version=$version"
            echo "commit=$upstream_commit"
            echo "published_at=$published_at"
            echo "source_asset=$source_asset"
            echo "release_tag=vibepollo-$version"
          } >> "$GITHUB_OUTPUT"

      - name: Resolve the pinned libvirtualdisplay submodule commit
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_COMMIT: ${{ steps.release.outputs.commit }}
        shell: bash
        run: |
          set -Eeuo pipefail
          tree_json="$(curl --fail --silent --show-error --location \
            --retry 5 --retry-all-errors \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/Nonary/Vibepollo/git/trees/$UPSTREAM_COMMIT?recursive=1")"
          libvirtualdisplay_commit="$(jq -er '
            ([.tree[] | select(.path == "third-party/libvirtualdisplay-linux" and .mode == "160000" and .type == "commit") | .sha][0])
            // ([.tree[] | select(.path == "third-party/libvirtualdisplay" and .mode == "160000" and .type == "commit") | .sha][0])
          ' <<<"$tree_json")"
          [[ "$libvirtualdisplay_commit" =~ ^[0-9a-f]{40}$ ]]
          echo "LIBVIRTUALDISPLAY_COMMIT=$libvirtualdisplay_commit" >> "$GITHUB_ENV"

      - name: Set reproducible archive timestamp
        env:
          PUBLISHED_AT: ${{ steps.release.outputs.published_at }}
        run: echo "SOURCE_DATE_EPOCH=$(date -u --date="$PUBLISHED_AT" +%s)" >> "$GITHUB_ENV"

      - name: Download the exact source archive used by the app release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.release_tag }}
          SOURCE_ASSET: ${{ steps.release.outputs.source_asset }}
        run: |
          set -Eeuo pipefail
          mkdir -p dist
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern "$SOURCE_ASSET" --dir dist
          test -s "dist/$SOURCE_ASSET"

      - name: Validate Cask scripts and package policy
        env:
          VIBEPOLLO_SKIP_PUBLISHED_ASSET_CHECK: "1"
        run: python3 scripts/test-drm-packages.py

      - name: Build only the Cask integration archive
        env:
          VERSION: ${{ steps.release.outputs.version }}
          SOURCE_ASSET: ${{ steps.release.outputs.source_asset }}
        shell: bash
        run: |
          set -Eeuo pipefail
          output="dist/vibepollo-drm-integration-$VERSION.tar.gz"
          bash scripts/package-cask-payload.sh "$output" "dist/$SOURCE_ASSET"
          sha256sum "$output" | tee dist/cask-sha256.txt
          echo "CASK_SHA256=$(awk '{print $1}' dist/cask-sha256.txt)" >> "$GITHUB_ENV"
          source_sha256="$(sha256sum "dist/$SOURCE_ASSET" | awk '{print $1}')"
          echo "SOURCE_SHA256=$source_sha256" >> "$GITHUB_ENV"

      - name: Verify Cask archive contents and deterministic checksum
        env:
          VERSION: ${{ steps.release.outputs.version }}
          SOURCE_ASSET: ${{ steps.release.outputs.source_asset }}
        run: |
          set -Eeuo pipefail
          archive="dist/vibepollo-drm-integration-$VERSION.tar.gz"
          python3 - "$archive" <<'PY'
          import pathlib, sys, tarfile
          expected = {
              "install.sh", "install-complete.sh", "uninstall.sh", "uninstall-complete.sh", "vibepollo-askpass", "vibeshine-drmctl",
              "vibeshine-vkms", "vibeshine-vkms-quiesce",
              "vibeshine-vkms.service", "vibeshine-vkms-control.socket",
              "vibeshine-vkms-control@.service",
          }
          with tarfile.open(sys.argv[1], "r:gz") as archive:
              members = archive.getmembers()
              names = {member.name for member in members}
              if names != expected or len(members) != len(expected):
                  raise SystemExit(f"Unexpected Cask archive members: {sorted(names)}")
              if any(not member.isfile() for member in members):
                  raise SystemExit("Cask archive contains a non-regular file")
          print("Cask archive contains exactly the expected privileged integration files.")
          PY

      - name: Update the release Cask asset and checksum manifest
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.release.outputs.version }}
          RELEASE_TAG: ${{ steps.release.outputs.release_tag }}
        shell: bash
        run: |
          set -Eeuo pipefail
          asset="dist/vibepollo-drm-integration-$VERSION.tar.gz"
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern SHA256SUMS --dir dist
          manifest="dist/SHA256SUMS"
          test -s "$manifest"
          grep -vE '(^|[[:space:]])vibepollo-drm-integration-[0-9]+\.[0-9]+\.[0-9]+\.tar\.gz$' "$manifest" > "$manifest.new" || true
          mv "$manifest.new" "$manifest"
          (cd dist && sha256sum "$(basename "$asset")" >> SHA256SUMS)
          (cd dist && sha256sum --check <(grep -F "  $(basename "$asset")" SHA256SUMS))
          gh release upload "$RELEASE_TAG" "$asset" "$manifest" \
            --repo "$GITHUB_REPOSITORY" --clobber

      - name: Update the DRM Formula and Cask definitions in the tap
        env:
          VERSION: ${{ steps.release.outputs.version }}
          UPSTREAM_COMMIT: ${{ steps.release.outputs.commit }}
          SOURCE_SHA256: ${{ env.SOURCE_SHA256 }}
          LIBVIRTUALDISPLAY_COMMIT: ${{ env.LIBVIRTUALDISPLAY_COMMIT }}
          CASK_SHA256: ${{ env.CASK_SHA256 }}
        shell: bash
        run: |
          set -Eeuo pipefail
          git fetch origin main
          git checkout -B main origin/main

          latest_version="$(tr -d '[:space:]' < upstream-version)"
          latest_commit="$(tr -d '[:space:]' < upstream-commit)"
          if [[ "$latest_version" != "$VERSION" || "$latest_commit" != "$UPSTREAM_COMMIT" ]]; then
            echo "::error::A newer upstream app release is already published; refusing to update DRM packages from a stale source."
            exit 1
          fi

          release_root="https://github.com/Remagnad/vibepollo-homebrew/releases/download/vibepollo-$VERSION"
          mkdir -p "$RUNNER_TEMP/Formula" "$RUNNER_TEMP/Casks"
          python3 scripts/render-drm-packages.py \
            --version "$VERSION" \
            --source-url "$release_root/vibepollo-source-$VERSION.tar.gz" \
            --source-sha "$SOURCE_SHA256" \
            --libvirtualdisplay-commit "$LIBVIRTUALDISPLAY_COMMIT" \
            --cask-url "$release_root/vibepollo-drm-integration-$VERSION.tar.gz" \
            --cask-sha "$CASK_SHA256" \
            --formula-template Formula/vibepollo-drm.rb \
            --cask-template Casks/vibepollo.rb \
            --formula-output "$RUNNER_TEMP/Formula/vibepollo-drm.rb" \
            --cask-output "$RUNNER_TEMP/Casks/vibepollo.rb"

          cp "$RUNNER_TEMP/Formula/vibepollo-drm.rb" Formula/vibepollo-drm.rb
          cp "$RUNNER_TEMP/Casks/vibepollo.rb" Casks/vibepollo.rb
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/vibepollo-drm.rb Casks/vibepollo.rb
          if git diff --cached --quiet; then
            echo "DRM Formula and Cask metadata are already current."
          else
            git commit -m "Update Vibepollo DRM Formula and Cask to $VERSION"
            git push origin HEAD:main
          fi

      - name: Report Cask-only publication
        env:
          VERSION: ${{ steps.release.outputs.version }}
          CASK_SHA256: ${{ env.CASK_SHA256 }}
        run: |
          echo "Published Cask integration for Vibepollo $VERSION"
          echo "Cask SHA-256: $CASK_SHA256"
          echo "The application bottle workflow was not run."
