name: Watch upstream stable releases

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      rebuild:
        description: Rebuild the latest stable release even when its version was already processed
        required: false
        default: false
        type: boolean
  push:
    branches: [main]
    paths:
      - ".github/workflows/watch-upstream-release.yml"
      - "scripts/**"
      - "Formula/**"

permissions:
  contents: read

concurrency:
  group: vibepollo-upstream-release
  cancel-in-progress: false

env:
  HOMEBREW_NO_AUTO_UPDATE: "1"
  HOMEBREW_NO_ANALYTICS: "1"
  HOMEBREW_NO_INSTALL_CLEANUP: "1"
  HOMEBREW_NO_AUTOREMOVE: "1"
  # Pre-fetch all bottle dependencies concurrently instead of Homebrew's small runner-based default.
  HOMEBREW_DOWNLOAD_CONCURRENCY: "16"

jobs:
  check-upstream:
    name: Check latest stable upstream release
    runs-on: ubuntu-24.04
    outputs:
      updated: ${{ steps.release.outputs.updated }}
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
      commit: ${{ steps.release.outputs.commit }}
      published_at: ${{ steps.release.outputs.published_at }}
    steps:
      - name: Check out tap
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Read latest stable release and compare
        id: release
        shell: bash
        run: |
          set -Eeuo pipefail

          release_json="$(curl --fail --silent --show-error --location \
            --retry 5 --retry-all-errors \
            https://api.github.com/repos/Nonary/Vibepollo/releases/latest)"

          jq -e '(.draft == false) and (.prerelease == false)' <<<"$release_json" >/dev/null
          tag="$(jq -r '.tag_name' <<<"$release_json")"
          published_at="$(jq -r '.published_at' <<<"$release_json")"
          version="${tag#v}"

          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Latest upstream tag is not a stable semver release: $tag"
            exit 1
          fi

          commit_json="$(curl --fail --silent --show-error --location \
            --retry 5 --retry-all-errors \
            "https://api.github.com/repos/Nonary/Vibepollo/commits/$tag")"
          commit="$(jq -r '.sha' <<<"$commit_json")"

          if [[ ! "$commit" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Could not resolve a full commit SHA for $tag"
            exit 1
          fi

          # A queued workflow may have started from an older main commit.
          # Compare against the live branch, not only the triggering snapshot.
          git fetch --quiet origin main
          current="0.0.0"
          processed_commit="unknown"
          if git cat-file -e origin/main:upstream-version 2>/dev/null; then
            current="$(git show origin/main:upstream-version | tr -d '[:space:]')"
          fi
          if git cat-file -e origin/main:upstream-commit 2>/dev/null; then
            processed_commit="$(git show origin/main:upstream-commit | tr -d '[:space:]')"
          fi
          if [[ ! "$current" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid upstream-version state: $current"
            exit 1
          fi
          if [[ "$processed_commit" != "unknown" && ! "$processed_commit" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Invalid upstream-commit state: $processed_commit"
            exit 1
          fi

          # Do not downgrade if upstream ever serves an older stable release.
          newest="$(printf '%s\n%s\n' "$current" "$version" | sort -V | tail -n1)"
          updated=false
          if [[ "$newest" == "$version" && ( "$version" != "$current" || "$commit" != "$processed_commit" ) ]]; then
            updated=true
          fi
          force_rebuild="${{ inputs.rebuild || github.event_name == 'push' }}"
          if [[ "$force_rebuild" == "true" && "$newest" == "$version" ]]; then
            updated=true
          fi

          echo "Latest stable upstream: $tag ($commit)"
          echo "Last successfully published tap version: $current ($processed_commit)"
          echo "Update required: $updated"

          {
            echo "updated=$updated"
            echo "tag=$tag"
            echo "version=$version"
            echo "commit=$commit"
            echo "published_at=$published_at"
          } >> "$GITHUB_OUTPUT"

  build-and-verify:
    name: Build, bottle and verify Linux x86_64
    needs: check-upstream
    if: needs.check-upstream.outputs.updated == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    permissions:
      contents: read
    steps:
      - name: Check out tap
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@d482da0e602890d3160aade42e72c8556103bf04 # 2026.10.26.1
        with:
          # Formulae are resolved through Homebrew's JSON API; cloning homebrew/core
          # here adds several minutes and is unnecessary for a third-party tap.
          core: false
          cask: false

      - name: Export Homebrew cache paths
        id: brew-paths
        shell: bash
        run: |
          set -Eeuo pipefail
          prefix="$(brew --prefix)"
          cellar="$(brew --cellar)"
          cache_dir="$(brew --cache)"
          {
            echo "HOMEBREW_PREFIX=$prefix"
            echo "HOMEBREW_CELLAR=$cellar"
            echo "HOMEBREW_CACHE_DIR=$cache_dir"
          } >> "$GITHUB_ENV"
          {
            echo "prefix=$prefix"
            echo "cellar=$cellar"
            echo "cache_dir=$cache_dir"
          } >> "$GITHUB_OUTPUT"

      - name: Restore prebuilt Homebrew dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ steps.brew-paths.outputs.cellar }}
            ${{ steps.brew-paths.outputs.prefix }}/opt
            ${{ steps.brew-paths.outputs.prefix }}/bin
            ${{ steps.brew-paths.outputs.prefix }}/sbin
            ${{ steps.brew-paths.outputs.prefix }}/include
            ${{ steps.brew-paths.outputs.prefix }}/lib
            ${{ steps.brew-paths.outputs.prefix }}/share
            ${{ steps.brew-paths.outputs.prefix }}/etc
            ${{ steps.brew-paths.outputs.prefix }}/Frameworks
            ${{ steps.brew-paths.outputs.cache_dir }}/downloads
          key: vibepollo-homebrew-deps-ubuntu-22.04-x86_64-${{ hashFiles('Formula/vibepollo-app.rb') }}
          restore-keys: |
            vibepollo-homebrew-deps-ubuntu-22.04-x86_64-

      - name: Install system headers not provided by Homebrew
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libudev-dev ccache

      - name: Restore C/C++ compiler cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/Homebrew/vibepollo-ccache
          key: vibepollo-ccache-ubuntu-22.04-x86_64-gcc14-${{ github.run_id }}
          restore-keys: |
            vibepollo-ccache-ubuntu-22.04-x86_64-gcc14-

      - name: Report restored compiler cache state
        shell: bash
        run: |
          set -Eeuo pipefail
          cache_dir="$(brew --cache)/vibepollo-ccache"
          if [[ -d "$cache_dir" ]]; then
            echo "Restored CCache directory:"
            du -sh "$cache_dir"
            printf 'Cached object files: '
            find "$cache_dir" -type f | wc -l
          else
            echo "No previous CCache directory was restored."
          fi

      - name: Configure C/C++ compiler cache
        shell: bash
        run: |
          set -Eeuo pipefail
          cache_root="$(brew --cache)"
          ccache_dir="$cache_root/vibepollo-ccache"
          ccache_temp_dir="$cache_root/vibepollo-ccache-tmp"
          mkdir -p "$ccache_dir" "$ccache_temp_dir"
          cat > "$cache_root/vibepollo-ccache.conf" <<EOF
          cache_dir = $ccache_dir
          temporary_dir = $ccache_temp_dir
          max_size = 2G
          compiler_check = content
          base_dir = /var/tmp
          hash_dir = false
          EOF
          ccache --config-path "$cache_root/vibepollo-ccache.conf" --show-config
          ccache --config-path "$cache_root/vibepollo-ccache.conf" --zero-stats

      - name: Prepare exact upstream source bundle
        id: source
        env:
          TAG: ${{ needs.check-upstream.outputs.tag }}
          COMMIT: ${{ needs.check-upstream.outputs.commit }}
          RELEASE_PUBLISHED_AT: ${{ needs.check-upstream.outputs.published_at }}
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p dist
          export SOURCE_DATE_EPOCH
          SOURCE_DATE_EPOCH="$(date -u --date="$RELEASE_PUBLISHED_AT" +%s)"
          source_archive="$PWD/dist/vibepollo-source-${{ needs.check-upstream.outputs.version }}.tar.gz"

          bash scripts/prepare-source.sh "$TAG" "$COMMIT" "$source_archive"
          source_sha="$(sha256sum "$source_archive" | awk '{print $1}')"
          echo "source_archive=$source_archive" >> "$GITHUB_OUTPUT"
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"

          printf '%s\n' "$TAG" > dist/upstream-tag.txt
          printf '%s\n' "$COMMIT" > dist/upstream-commit.txt
          printf '%s\n' "$source_sha" > dist/source-sha256.txt
          printf '%s\n' "${{ needs.check-upstream.outputs.version }}" > dist/version.txt

      - name: Download pinned FFmpeg resource with retries
        id: ffmpeg
        env:
          SOURCE_ARCHIVE: ${{ steps.source.outputs.source_archive }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail

          pin_json="$(python3 - "$SOURCE_ARCHIVE" <<'PY'
          import json
          import re
          import sys
          import tarfile

          with tarfile.open(sys.argv[1], "r:gz") as bundle:
              matches = [
                  member for member in bundle.getmembers()
                  if member.isfile()
                  and member.name.endswith("/cmake/dependencies/ffmpeg-release.cmake")
              ]
              if len(matches) != 1:
                  raise SystemExit("Expected exactly one upstream ffmpeg-release.cmake")
              stream = bundle.extractfile(matches[0])
              if stream is None:
                  raise SystemExit("Could not read upstream FFmpeg release pin")
              cmake = stream.read().decode("utf-8")

          def value(name):
              values = re.findall(
                  r'set\(' + re.escape(name) + r'\s+"([^"]+)"\)', cmake
              )
              if not values:
                  raise SystemExit(f"Missing {name} in upstream FFmpeg pin")
              return values[-1]

          repository = value("FFMPEG_GITHUB_REPO")
          tag = value("FFMPEG_RELEASE_TAG")
          sha256 = value("FFMPEG_SHA256_Linux_x86_64")
          if not re.fullmatch(r"[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+", repository):
              raise SystemExit("Invalid FFmpeg repository pin")
          if not re.fullmatch(r"[A-Za-z0-9_.-]+", tag):
              raise SystemExit("Invalid FFmpeg release tag pin")
          if not re.fullmatch(r"[0-9a-f]{64}", sha256):
              raise SystemExit("Invalid FFmpeg SHA-256 pin")
          print(json.dumps({
              "repository": repository,
              "tag": tag,
              "sha256": sha256,
              "url": f"https://github.com/{repository}/releases/download/{tag}/Linux-x86_64-ffmpeg.tar.gz",
          }))
          PY
          )"

          ffmpeg_repo="$(jq -r '.repository' <<<"$pin_json")"
          ffmpeg_tag="$(jq -r '.tag' <<<"$pin_json")"
          ffmpeg_sha="$(jq -r '.sha256' <<<"$pin_json")"
          ffmpeg_url="$(jq -r '.url' <<<"$pin_json")"
          release_api="https://api.github.com/repos/$ffmpeg_repo/releases/tags/$ffmpeg_tag"
          release_json="$(curl --fail --silent --show-error --location \
            --retry 5 --retry-all-errors \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$release_api")"
          asset_id="$(jq -r '.assets[] | select(.name == "Linux-x86_64-ffmpeg.tar.gz") | .id' <<<"$release_json" | head -n1)"
          if [[ ! "$asset_id" =~ ^[0-9]+$ ]]; then
            echo "::error::Pinned upstream release has no Linux x86_64 FFmpeg asset."
            exit 1
          fi

          api_asset_url="https://api.github.com/repos/$ffmpeg_repo/releases/assets/$asset_id"
          output="$PWD/dist/Linux-x86_64-ffmpeg.tar.gz"
          part="$output.part"
          downloaded=false

          # Prefer GitHub's release-asset API, then fall back to the browser
          # download URL. Retry transient 5xx/CDN failures and verify SHA-256.
          for endpoint in api browser; do
            for attempt in {1..4}; do
              rm -f "$part"
              echo "Downloading pinned FFmpeg via $endpoint (attempt $attempt/4)"
              if [[ "$endpoint" == "api" ]]; then
                curl --fail --silent --show-error --location \
                  --retry 3 --retry-all-errors --retry-delay 3 --retry-max-time 180 \
                  --connect-timeout 30 --max-time 300 \
                  -H "Authorization: Bearer $GH_TOKEN" \
                  -H "Accept: application/octet-stream" \
                  -H "X-GitHub-Api-Version: 2022-11-28" \
                  "$api_asset_url" -o "$part" || true
              else
                curl --fail --silent --show-error --location \
                  --retry 3 --retry-all-errors --retry-delay 3 --retry-max-time 180 \
                  --connect-timeout 30 --max-time 300 \
                  "$ffmpeg_url" -o "$part" || true
              fi

              if [[ -s "$part" ]]; then
                actual_sha="$(sha256sum "$part" | awk '{print $1}')"
                if [[ "$actual_sha" == "$ffmpeg_sha" ]]; then
                  mv "$part" "$output"
                  downloaded=true
                  break 2
                fi
                echo "::warning::FFmpeg download SHA mismatch: expected $ffmpeg_sha, got $actual_sha"
              fi

              rm -f "$part"
              sleep $((attempt * 5))
            done
          done

          if [[ "$downloaded" != "true" ]]; then
            echo "::error::Could not download the pinned FFmpeg asset with a verified SHA-256."
            exit 1
          fi

          echo "Verified FFmpeg resource: $(du -h "$output" | awk '{print $1}')"
          echo "FFmpeg SHA-256: $ffmpeg_sha"
          echo "url=$ffmpeg_url" >> "$GITHUB_OUTPUT"
          echo "sha256=$ffmpeg_sha" >> "$GITHUB_OUTPUT"

      - name: Render temporary formula against the local source bundle
        env:
          VERSION: ${{ needs.check-upstream.outputs.version }}
          TAG: ${{ needs.check-upstream.outputs.tag }}
          COMMIT: ${{ needs.check-upstream.outputs.commit }}
          SOURCE_ARCHIVE: ${{ steps.source.outputs.source_archive }}
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
        run: |
          python3 scripts/render-formula.py \
            --version "$VERSION" \
            --tag "$TAG" \
            --commit "$COMMIT" \
            --source-url "http://127.0.0.1:8766/vibepollo-source-$VERSION.tar.gz" \
            --source-sha "$SOURCE_SHA" \
            --source-archive "$SOURCE_ARCHIVE" \
            --ffmpeg-url "http://127.0.0.1:8766/Linux-x86_64-ffmpeg.tar.gz" \
            --output Formula/vibepollo-app.rb

      - name: Auto-fix generated Formula style
        run: brew style --fix Formula/vibepollo-app.rb

      - name: Register the working tree as a local Homebrew tap
        shell: bash
        run: |
          set -Eeuo pipefail
          tap_name="Remagnad/vibepollo-homebrew"
          brew tap-new --no-git "$tap_name"
          tap_path="$(brew --repo "$tap_name")"
          mkdir -p "$tap_path/Formula"
          cp Formula/vibepollo-app.rb "$tap_path/Formula/vibepollo-app.rb"
          echo "tap_path=$tap_path" >> "$GITHUB_ENV"

      - name: Build formula with Homebrew
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m http.server 8766 --directory "$PWD/dist" --bind 127.0.0.1 \
            > "$RUNNER_TEMP/source-http.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT

          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:8766/ >/dev/null; then
              break
            fi
            sleep 1
          done
          curl --fail --silent \
            "http://127.0.0.1:8766/vibepollo-source-${{ needs.check-upstream.outputs.version }}.tar.gz" \
            -o /dev/null
          curl --fail --silent http://127.0.0.1:8766/Linux-x86_64-ffmpeg.tar.gz -o /dev/null

          brew install --build-bottle --verbose Remagnad/vibepollo-homebrew/vibepollo-app
          rm -f dist/Linux-x86_64-ffmpeg.tar.gz

      - name: Report compiler cache statistics
        if: always()
        shell: bash
        run: |
          cache_root="$(brew --cache)"
          config="$cache_root/vibepollo-ccache.conf"
          if [[ -f "$config" ]]; then
            ccache --config-path "$config" --show-stats
          else
            echo "CCache configuration was not created."
          fi

      - name: Test source installation and dynamic linkage
        run: |
          brew test Remagnad/vibepollo-homebrew/vibepollo-app
          brew linkage --test Remagnad/vibepollo-homebrew/vibepollo-app

      - name: Verify bottle JSON parser against Homebrew output format
        env:
          SOURCE_ARCHIVE: ${{ steps.source.outputs.source_archive }}
        run: |
          set -Eeuo pipefail
          cat > "$RUNNER_TEMP/test-bottle.json" <<'JSON'
          {
            "vibepollo-app": {
              "formula": {"name": "vibepollo-app"},
              "bottle": {
                "root_url": "https://example.invalid",
  
                "tags": {
                  "x86_64_linux": {
                    "local_filename": "vibepollo-app--9.9.9.x86_64_linux.bottle.tar.gz",
                    "sha256": "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
                  }
                }
              }
            }
          }
          JSON
          python3 scripts/render-formula.py \
            --version 9.9.9 \
            --tag 9.9.9 \
            --commit 0000000000000000000000000000000000000000 \
            --source-url "https://example.invalid/source.tar.gz" \
            --source-sha aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa \
            --source-archive "$SOURCE_ARCHIVE" \
            --bottle-json "$RUNNER_TEMP/test-bottle.json" \
            --bottle-root-url "https://example.invalid" \
            --output "$RUNNER_TEMP/test-vibepollo-app.rb"
          grep -F 'sha256 x86_64_linux: "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"' \
            "$RUNNER_TEMP/test-vibepollo-app.rb"

      - name: Create Linux x86_64 bottle metadata
        run: |
          set -Eeuo pipefail
          release_root="https://github.com/Remagnad/vibepollo-homebrew/releases/download/vibepollo-${{ needs.check-upstream.outputs.version }}"
          brew bottle --json \
            --root-url "$release_root" \
            Remagnad/vibepollo-homebrew/vibepollo-app

          bottle_file="$(find "$PWD" -maxdepth 1 -type f -name 'vibepollo-app--*.bottle.tar.gz' -print -quit)"
          bottle_json="$(find "$PWD" -maxdepth 1 -type f -name 'vibepollo-app*.json' -print -quit)"
          if [[ -z "$bottle_file" || -z "$bottle_json" ]]; then
            echo "::error::Homebrew did not produce both a bottle archive and JSON metadata."
            exit 1
          fi

          cp "$bottle_file" dist/
          cp "$bottle_json" dist/bottle.json
          bottle_name="$(basename "$bottle_file")"
          # Homebrew derives the download URL using a single separator between
          # the formula name and version, while `brew bottle` emits `--`.
          # Publish a byte-identical alias under the URL Homebrew requests.
          bottle_url_name="vibepollo-app-${{ needs.check-upstream.outputs.version }}.x86_64_linux.bottle.tar.gz"
          cp "dist/$bottle_name" "dist/$bottle_url_name"
          bottle_sha="$(sha256sum "dist/$bottle_name" | awk '{print $1}')"
          alias_sha="$(sha256sum "dist/$bottle_url_name" | awk '{print $1}')"
          test "$bottle_sha" = "$alias_sha"
          printf '%s\n' "$bottle_name" > dist/bottle-filename.txt
          printf '%s\n' "$bottle_sha" > dist/bottle-sha256.txt
          printf '%s\n' "$bottle_url_name" > dist/bottle-url-filename.txt

      - name: Reinstall from the bottle in a clean Homebrew transaction
        env:
          VERSION: ${{ needs.check-upstream.outputs.version }}
          TAG: ${{ needs.check-upstream.outputs.tag }}
          COMMIT: ${{ needs.check-upstream.outputs.commit }}
          SOURCE_ARCHIVE: ${{ steps.source.outputs.source_archive }}
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 scripts/render-formula.py \
            --version "$VERSION" \
            --tag "$TAG" \
            --commit "$COMMIT" \
            --source-url "http://127.0.0.1:8766/vibepollo-source-$VERSION.tar.gz" \
            --source-sha "$SOURCE_SHA" \
            --source-archive "$SOURCE_ARCHIVE" \
            --bottle-json dist/bottle.json \
            --bottle-root-url "http://127.0.0.1:8765" \
            --output Formula/vibepollo-app.rb

          cp Formula/vibepollo-app.rb "$tap_path/Formula/vibepollo-app.rb"
          brew uninstall --force --ignore-dependencies Remagnad/vibepollo-homebrew/vibepollo-app

          /usr/bin/python3 -m http.server 8765 --bind 127.0.0.1 --directory "$PWD/dist" > "$RUNNER_TEMP/bottle-http.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          server_ready=false
          for attempt in {1..20}; do
            if ! kill -0 "$server_pid" 2>/dev/null; then
              cat "$RUNNER_TEMP/bottle-http.log"
              echo "::error::Local bottle HTTP server exited before becoming ready."
              exit 1
            fi
            if curl --fail --silent http://127.0.0.1:8765/ >/dev/null; then
              server_ready=true
              break
            fi
            sleep 1
          done
          if [[ "$server_ready" != "true" ]]; then
            cat "$RUNNER_TEMP/bottle-http.log"
            echo "::error::Local bottle HTTP server did not become ready."
            exit 1
          fi

          brew install --force-bottle --ignore-dependencies Remagnad/vibepollo-homebrew/vibepollo-app
          brew test Remagnad/vibepollo-homebrew/vibepollo-app
          brew linkage --test Remagnad/vibepollo-homebrew/vibepollo-app

      - name: Upload verified source and bottle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: vibepollo-linux-x86_64-${{ needs.check-upstream.outputs.version }}
          path: dist/
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish release assets and update Formula
    needs: [check-upstream, build-and-verify]
    if: needs.check-upstream.outputs.updated == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Check out tap
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Download verified build
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: vibepollo-linux-x86_64-${{ needs.check-upstream.outputs.version }}
          path: dist

      - name: Set up Homebrew for formula audit
        uses: Homebrew/actions/setup-homebrew@d482da0e602890d3160aade42e72c8556103bf04 # 2026.10.26.1
        with:
          core: false
          cask: false

      - name: Create a local tap for formula validation
        run: |
          set -Eeuo pipefail
          brew tap-new --no-git Remagnad/vibepollo-homebrew
          tap_path="$(brew --repo Remagnad/vibepollo-homebrew)"
          mkdir -p "$tap_path/Formula"
          echo "tap_path=$tap_path" >> "$GITHUB_ENV"

      - name: Verify build artifact and render Formula in isolated publish job
        env:
          VERSION: ${{ needs.check-upstream.outputs.version }}
          TAG: ${{ needs.check-upstream.outputs.tag }}
          COMMIT: ${{ needs.check-upstream.outputs.commit }}
        shell: bash
        run: |
          set -Eeuo pipefail
          source_asset="dist/vibepollo-source-$VERSION.tar.gz"
          bottle_json="dist/bottle.json"
          bottle_file="$(find dist -maxdepth 1 -type f -name 'vibepollo-app--*.bottle.tar.gz' -print -quit)"
          test -s "$source_asset"
          test -s "$bottle_json"
          test -s "$bottle_file"

          bottle_name="$(basename "$bottle_file")"
          recorded_name="$(tr -d '[:space:]' < dist/bottle-filename.txt)"
          bottle_url_name="$(tr -d '[:space:]' < dist/bottle-url-filename.txt)"
          bottle_url_file="dist/$bottle_url_name"
          if [[ "$bottle_name" != "$recorded_name" ]]; then
            echo "::error::Bottle filename does not match the build manifest."
            exit 1
          fi
          test -s "$bottle_url_file"

          source_sha="$(sha256sum "$source_asset" | awk '{print $1}')"
          bottle_sha="$(sha256sum "$bottle_file" | awk '{print $1}')"
          bottle_url_sha="$(sha256sum "$bottle_url_file" | awk '{print $1}')"
          if [[ "$bottle_sha" != "$bottle_url_sha" ]]; then
            echo "::error::Bottle URL alias does not match the verified bottle archive."
            exit 1
          fi
          python3 - "$bottle_json" "$bottle_sha" <<'PY'
          import json
          import re
          import sys

          with open(sys.argv[1], encoding="utf-8") as stream:
              raw = json.load(stream)

          if isinstance(raw, dict) and "bottle" not in raw:
              records = [value for value in raw.values() if isinstance(value, dict)]
          elif isinstance(raw, list):
              records = raw
          else:
              records = [raw]

          expected = None
          for record in records:
              bottle = record.get("bottle", {})
              entry = bottle.get("tags", {}).get("x86_64_linux")
              if entry:
                  expected = entry.get("sha256")
                  break

          actual = sys.argv[2]
          if not expected or not re.fullmatch(r"[0-9a-f]{64}", expected):
              raise SystemExit("Bottle JSON lacks a valid x86_64_linux SHA-256.")
          if expected != actual:
              raise SystemExit(f"Bottle digest mismatch: metadata={expected}, archive={actual}")
          PY

          release_root="https://github.com/Remagnad/vibepollo-homebrew/releases/download/vibepollo-$VERSION"
          mkdir -p "$RUNNER_TEMP/Formula"
          python3 scripts/render-formula.py \
            --version "$VERSION" \
            --tag "$TAG" \
            --commit "$COMMIT" \
            --source-url "$release_root/vibepollo-source-$VERSION.tar.gz" \
            --source-sha "$source_sha" \
            --source-archive "$source_asset" \
            --bottle-json "$bottle_json" \
            --bottle-root-url "$release_root" \
            --output "$RUNNER_TEMP/Formula/vibepollo-app.rb"

          brew style --fix "$RUNNER_TEMP/Formula/vibepollo-app.rb"

          # Audit the formula generated from trusted tap code before any release
          # asset is published. The build job never supplies executable formula
          # code to this write-enabled job.
          cp "$RUNNER_TEMP/Formula/vibepollo-app.rb" "$tap_path/Formula/vibepollo-app.rb"
          brew trust --formula Remagnad/vibepollo-homebrew/vibepollo-app
          brew audit --strict --formula Remagnad/vibepollo-homebrew/vibepollo-app

          (
            cd dist
            sha256sum "vibepollo-source-$VERSION.tar.gz" "$bottle_name" "$bottle_url_name" > SHA256SUMS
          )

      - name: Publish source bundle and bottle
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.check-upstream.outputs.version }}
          TAG: ${{ needs.check-upstream.outputs.tag }}
          COMMIT: ${{ needs.check-upstream.outputs.commit }}
        run: |
          set -Eeuo pipefail
          release_tag="vibepollo-$VERSION"
          release_title="Vibepollo $VERSION - Homebrew Linux x86_64"

          cat > dist/release-notes.md <<EOF
          Automated Homebrew build of upstream Vibepollo $VERSION.

          - Upstream tag: $TAG
          - Upstream commit: $COMMIT
          - Target: Linux x86_64 (Ubuntu 22.04 builder)
          - Source bundle and bottle were built and tested by GitHub Actions.
          - The bottle was poured in a separate Homebrew install transaction and tested again.

          Workflow run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID
          EOF

          source_asset="dist/vibepollo-source-$VERSION.tar.gz"
          bottle_asset="dist/$(cat dist/bottle-filename.txt)"
          bottle_url_asset="dist/$(cat dist/bottle-url-filename.txt)"
          test -s "$source_asset"
          test -s "$bottle_asset"
          test -s "$bottle_url_asset"
          (cd dist && sha256sum --check SHA256SUMS)

          if gh release view "$release_tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$release_tag" "$source_asset" "$bottle_asset" "$bottle_url_asset" dist/bottle.json dist/SHA256SUMS \
              --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$release_tag" --repo "$GITHUB_REPOSITORY" \
              --title "$release_title" --notes-file dist/release-notes.md
          else
            gh release create "$release_tag" "$source_asset" "$bottle_asset" "$bottle_url_asset" dist/bottle.json dist/SHA256SUMS \
              --repo "$GITHUB_REPOSITORY" --title "$release_title" \
              --notes-file dist/release-notes.md
          fi

      - name: Rebase publication onto the latest main
        run: |
          set -Eeuo pipefail
          git fetch origin main
          git checkout -B main origin/main

      - name: Audit and commit the final Formula
        env:
          VERSION: ${{ needs.check-upstream.outputs.version }}
        run: |
          set -Eeuo pipefail
          current="$(tr -d '[:space:]' < upstream-version)"
          newest="$(printf '%s\n' "$current" "$VERSION" | sort -V | tail -n1)"
          if [[ "$newest" != "$VERSION" ]]; then
            echo "main already contains a newer Vibepollo formula ($current); skipping downgrade."
            exit 0
          fi

          mkdir -p Formula
          cp "$RUNNER_TEMP/Formula/vibepollo-app.rb" Formula/vibepollo-app.rb
          cp Formula/vibepollo-app.rb "$tap_path/Formula/vibepollo-app.rb"
          brew audit --strict --online --formula Remagnad/vibepollo-homebrew/vibepollo-app

      - name: Commit the successful upstream version to main
        env:
          VERSION: ${{ needs.check-upstream.outputs.version }}
          COMMIT: ${{ needs.check-upstream.outputs.commit }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          current="$(tr -d '[:space:]' < upstream-version)"
          newest="$(printf '%s\n' "$current" "$VERSION" | sort -V | tail -n1)"
          if [[ "$newest" != "$VERSION" ]]; then
            echo "main already contains a newer Vibepollo release ($current); skipping downgrade."
            exit 0
          fi
          test -s Formula/vibepollo-app.rb
          printf '%s\n' "$VERSION" > upstream-version
          printf '%s\n' "$COMMIT" > upstream-commit
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/vibepollo-app.rb upstream-version upstream-commit
          if git diff --cached --quiet; then
            echo "Formula already matches the verified release; no commit required."
            exit 0
          fi
          git commit -m "Update Vibepollo to $VERSION"
          git push origin HEAD:main
