name: DRM package checks

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/drm-package-check.yml"
      - "Formula/vibepollo-drm.rb"
      - "Casks/vibepollo.rb"
      - "scripts/test-drm-packages.py"
      - "scripts/package-cask-payload.sh"
      - "scripts/render-drm-packages.py"
      - "scripts/prepare-source.sh"
      - "cask-payload/**"
  push:
    branches:
      - main
      - feature/vibeshine-drm-formula
    paths:
      - ".github/workflows/drm-package-check.yml"
      - "Formula/vibepollo-drm.rb"
      - "Casks/vibepollo.rb"
      - "scripts/test-drm-packages.py"
      - "scripts/package-cask-payload.sh"
      - "scripts/render-drm-packages.py"
      - "scripts/prepare-source.sh"
      - "cask-payload/**"

permissions:
  contents: read

jobs:
  syntax-and-policy:
    name: Formula, Cask and shell checks
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@d482da0e602890d3160aade42e72c8556103bf04 # 2026.10.26.1
        with:
          core: false
          cask: false

      - name: Validate Formula, Cask, payload checksum and lifecycle policy
        run: python3 scripts/test-drm-packages.py

      - name: Run Homebrew style and audits against the complete tap
        shell: bash
        run: |
          set -Eeuo pipefail
          tap_name="Remagnad/vibepollo-homebrew"
          brew tap-new --no-git "$tap_name"
          brew trust "$tap_name"
          tap_path="$(brew --repo "$tap_name")"
          mkdir -p "$tap_path/Formula" "$tap_path/Casks"
          cp Formula/vibepollo-app.rb "$tap_path/Formula/vibepollo-app.rb"
          cp Formula/vibepollo-drm.rb "$tap_path/Formula/vibepollo-drm.rb"
          cp Casks/vibepollo.rb "$tap_path/Casks/vibepollo.rb"
          brew style "$tap_path/Formula/vibepollo-app.rb" "$tap_path/Formula/vibepollo-drm.rb" "$tap_path/Casks/vibepollo.rb"
          brew audit --strict --formula "$tap_name/vibepollo-app"
          brew audit --strict --formula "$tap_name/vibepollo-drm"
          brew audit --strict --cask "$tap_name/vibepollo"

      - name: Check patch whitespace
        run: git diff --check
