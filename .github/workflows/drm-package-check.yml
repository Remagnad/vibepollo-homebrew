name: DRM package checks

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/drm-package-check.yml"
      - ".github/workflows/build-cask-integration.yml"
      - "Formula/vibepollo-drm.rb"
      - "Casks/vibepollo.rb"
      - "scripts/test-drm-packages.py"
      - "scripts/migrate-installed-cask-sudo.py"
      - "scripts/package-cask-payload.sh"
      - "scripts/render-drm-packages.py"
      - "cask-payload/**"
      - "integration/**"
  push:
    branches:
      - main
      - feature/vibeshine-drm-formula
    paths:
      - ".github/workflows/drm-package-check.yml"
      - ".github/workflows/build-cask-integration.yml"
      - "Formula/vibepollo-drm.rb"
      - "Casks/vibepollo.rb"
      - "scripts/test-drm-packages.py"
      - "scripts/migrate-installed-cask-sudo.py"
      - "scripts/package-cask-payload.sh"
      - "scripts/render-drm-packages.py"
      - "cask-payload/**"
      - "integration/**"

permissions:
  contents: read

jobs:
  syntax-and-policy:
    name: Formula, Cask and shell checks
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@d482da0e602890d3160aade42e72c8556103bf04 # 2026.10.26.1
        with:
          core: false
          cask: false

      - name: Validate Formula, Cask, payload checksum and lifecycle policy
        env:
          VIBEPOLLO_SKIP_PUBLISHED_ASSET_CHECK: "1"
        run: python3 scripts/test-drm-packages.py

      - name: Run Homebrew style and audits against the complete tap
        shell: bash
        run: |
          set -Eeuo pipefail
          tap_name="Remagnad/vibepollo-homebrew"
          brew tap-new --no-git "$tap_name"
          brew trust "$tap_name"
          tap_path="$(brew --repo "$tap_name")"
          mkdir -p "$tap_path/Formula" "$tap_path/Casks"
          cp Formula/vibepollo-app.rb "$tap_path/Formula/vibepollo-app.rb"
          cp Formula/vibepollo-drm.rb "$tap_path/Formula/vibepollo-drm.rb"
          cp Casks/vibepollo.rb "$tap_path/Casks/vibepollo.rb"
          brew style "$tap_path/Formula/vibepollo-app.rb" "$tap_path/Formula/vibepollo-drm.rb" "$tap_path/Casks/vibepollo.rb"
          brew audit --strict --formula "$tap_name/vibepollo-app"
          brew audit --strict --formula "$tap_name/vibepollo-drm"
          brew audit --strict --cask "$tap_name/vibepollo"
          brew info --json=v2 --cask "$tap_name/vibepollo" > "$RUNNER_TEMP/vibepollo-cask-info.json"
          python3 - "$RUNNER_TEMP/vibepollo-cask-info.json" <<'PY'
          import json, pathlib, sys
          document = json.loads(pathlib.Path(sys.argv[1]).read_text())
          casks = document.get("casks", [])
          if len(casks) != 1:
              raise SystemExit("Homebrew JSON info did not return exactly one Vibepollo Cask")
          artifacts = casks[0].get("artifacts", [])
          entries = [item["uninstall_preflight_steps"] for item in artifacts
                     if isinstance(item, dict) and "uninstall_preflight_steps" in item]
          if len(entries) != 1:
              raise SystemExit("Homebrew JSON info did not serialize uninstall_preflight_steps")
          serialized = json.dumps(entries[0])
          for marker in ('"sudo": true', '"SUDO_ASKPASS"', "vibepollo-askpass",
                         "uninstall.sh", '"base": "staged_path"'):
              if marker not in serialized:
                  raise SystemExit(f"Homebrew uninstall step is missing {marker}")
          print("Homebrew JSON metadata preserves the privileged uninstall and askpass configuration.")
          PY

      - name: Check patch whitespace
        run: git diff --check
