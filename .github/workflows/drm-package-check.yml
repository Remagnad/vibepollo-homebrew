name: DRM package checks

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feature/vibeshine-drm-formula
    paths:
      - "Formula/vibepollo-drm.rb"
      - "Casks/vibepollo.rb"
      - "scripts/test-drm-packages.py"
      - ".github/workflows/drm-package-check.yml"

permissions:
  contents: read

jobs:
  syntax-and-policy:
    name: Formula, Cask and shell syntax
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Validate Formula and Cask Ruby syntax and shell scripts
        run: python3 scripts/test-drm-packages.py
      - name: Check patch whitespace
        run: git diff --check
