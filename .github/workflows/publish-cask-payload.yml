name: Publish updated Cask integration payload

on:
  push:
    branches: [main]
    paths:
      - "cask-payload/**"
      - "integration/**"
      - "scripts/package-cask-payload.sh"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vibepollo-cask-payload
  cancel-in-progress: true

jobs:
  package-and-publish:
    name: Package and publish privileged integration
    runs-on: ubuntu-24.04
    steps:
      - name: Check out tap
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up GitHub CLI
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh auth status

      - name: Download verified upstream source bundle
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          version="$(tr -d '[:space:]' < upstream-version)"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid upstream-version: $version"
            exit 1
          fi
          release_tag="vibepollo-$version"
          source_name="vibepollo-source-$version.tar.gz"
          mkdir -p "$RUNNER_TEMP/vibepollo-source"
          gh release download "$release_tag" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "$source_name" \
            --dir "$RUNNER_TEMP/vibepollo-source"
          source_archive="$RUNNER_TEMP/vibepollo-source/$source_name"
          test -s "$source_archive"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"
          echo "source_archive=$source_archive" >> "$GITHUB_OUTPUT"

      - name: Build deterministic Cask payload
        id: package
        env:
          VERSION: ${{ steps.source.outputs.version }}
          SOURCE_ARCHIVE: ${{ steps.source.outputs.source_archive }}
        shell: bash
        run: |
          set -Eeuo pipefail
          output="$PWD/dist/vibepollo-drm-integration-$VERSION.tar.gz"
          mkdir -p dist
          SOURCE_DATE_EPOCH=0 bash scripts/package-cask-payload.sh "$output" "$SOURCE_ARCHIVE"
          archive_sha="$(sha256sum "$output" | awk '{print $1}')"
          tar -tzf "$output" >/dev/null
          echo "archive=$output" >> "$GITHUB_OUTPUT"
          echo "sha256=$archive_sha" >> "$GITHUB_OUTPUT"
          echo "Cask payload SHA-256: $archive_sha"

      - name: Publish Cask payload and update Cask checksum
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.source.outputs.version }}
          RELEASE_TAG: ${{ steps.source.outputs.release_tag }}
          ARCHIVE: ${{ steps.package.outputs.archive }}
          ARCHIVE_SHA: ${{ steps.package.outputs.sha256 }}
        shell: bash
        run: |
          set -Eeuo pipefail
          asset_name="vibepollo-drm-integration-$VERSION.tar.gz"
          test "$(basename "$ARCHIVE")" = "$asset_name"
          gh release upload "$RELEASE_TAG" "$ARCHIVE" \
            --repo "$GITHUB_REPOSITORY" --clobber

          git fetch origin main
          git checkout -B main origin/main
          python3 - "$VERSION" "$ARCHIVE_SHA" Casks/vibepollo.rb <<'PY'
          import pathlib
          import re
          import sys

          version, digest, filename = sys.argv[1:]
          if not re.fullmatch(r"[0-9]+\\.[0-9]+\\.[0-9]+", version):
              raise SystemExit("Invalid Cask version")
          if not re.fullmatch(r"[0-9a-f]{64}", digest):
              raise SystemExit("Invalid Cask payload SHA-256")

          path = pathlib.Path(filename)
          content = path.read_text(encoding="utf-8")
          version_match = re.search(r'^  version "([^"]+)"$', content, re.M)
          if not version_match or version_match.group(1) != version:
              raise SystemExit(
                  f"Cask version does not match upstream-version: "
                  f"{version_match.group(1) if version_match else 'missing'} != {version}"
              )
          updated, count = re.subn(
              r'^  sha256 "[0-9a-f]{64}"$',
              f'  sha256 "{digest}"',
              content,
              count=1,
              flags=re.M,
          )
          if count != 1:
              raise SystemExit("Could not uniquely update Cask SHA-256")
          path.write_text(updated, encoding="utf-8")
          PY

          git diff --check
          if git diff --quiet -- Casks/vibepollo.rb; then
            echo "Cask checksum is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/vibepollo.rb
          git commit -m "Update Vibepollo Cask integration payload checksum"
          git push origin HEAD:main
